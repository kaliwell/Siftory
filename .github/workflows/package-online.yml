name: Windows online installer
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: online-installer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      FLOATING_CLOCK_KEEP_UNPACKED: '1'
      FLOATING_CLOCK_PACKAGE_PROFILE: online
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      FLOATING_CLOCK_UI_SMOKE_TIMEOUT_MS: '120000'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - name: Verify preview and native mutation regressions
        env:
          TEMP: ${{ runner.temp }}\siftory-native-tests
          TMP: ${{ runner.temp }}\siftory-native-tests
        run: |
          # Relative-root fixtures must remain relative. Across drive letters,
          # path.relative returns an absolute path and selects volume-wide USN.
          New-Item -ItemType Directory -Path $env:TEMP -Force | Out-Null
          if ([IO.Path]::GetPathRoot($env:TEMP) -ne [IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)) { throw 'Native fixture temp must share the workspace drive' }
          npm run build:native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/native-incremental-index.test.cjs tests/native-exact-bulk-delete.test.cjs tests/native-scan.test.cjs tests/native-search-correctness.test.cjs tests/native-segment-v3.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/performance-diagnostics.test.cjs tests/scan-responsiveness.test.cjs tests/scan-responsiveness-renderer.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:project-preview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch the pinned online font
        run: npm run resources:fetch -- --profile=online --component=adobe-source-han-sans-cn-vf-2-005 --cache-dir=.runtime-cache
      - name: Restore hash-pinned covered-source archive from Alpha 22
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'siftory-reviewed-source'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          gh release download v1.0.1-alpha.22 --repo $env:GITHUB_REPOSITORY --pattern Siftory-1.0.1-alpha.22-Windows-x64-Setup.exe --dir $root
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve reviewed installer' }
          $installer = Join-Path $root 'Siftory-1.0.1-alpha.22-Windows-x64-Setup.exe'
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd72d5c10f4f9a3a2ab6c3b26713114094ac2499f22747ebbb4cd9545eeb4011b') { throw 'Reviewed installer hash mismatch' }
          $seven = 'C:\Program Files\7-Zip\7z.exe'
          # Slice the hash-verified embedded archive explicitly: Windows 7-Zip
          # otherwise detects the executable stub instead of the 7z payload.
          $archive = Join-Path $root 'reviewed-app.7z'
          $inputFile = [IO.File]::OpenRead($installer)
          $outputFile = [IO.File]::Create($archive)
          try {
            [void]$inputFile.Seek(202233, [IO.SeekOrigin]::Begin)
            $remaining = 175581359
            $buffer = New-Object byte[] 1048576
            while ($remaining -gt 0) {
              $count = $inputFile.Read($buffer, 0, [Math]::Min($buffer.Length, $remaining))
              if ($count -eq 0) { throw 'Truncated embedded archive' }
              $outputFile.Write($buffer, 0, $count)
              $remaining -= $count
            }
          } finally { $outputFile.Dispose(); $inputFile.Dispose() }
          & $seven x $archive "-o$root/payload" 'resources/legal/covered-source/canvas-rust-sources.zip' -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Cannot extract reviewed covered source' }
          $source = @(Get-ChildItem "$root/payload" -Recurse -Filter canvas-rust-sources.zip -File)
          if ($source.Count -ne 1 -or $source[0].Length -ne 3341429) { throw 'Unexpected covered source payload' }
          if ((Get-FileHash $source[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne '22d7c34a95cbbc3aca6402f218fe60d6ee1b5d1fa8b55c30a0eb88448e84a5ae') { throw 'Covered source hash mismatch' }
          Copy-Item $source[0].FullName legal/covered-source/canvas-rust-sources.zip
      - run: npm run build:native:electron
      - name: Record freshly compiled native provenance
        run: node scripts/record-native-package-build.cjs
      - run: node scripts/generate-third-party-components.cjs
      - run: npm run licenses:gate
      - run: npm run build:online
      - name: Verify real Windows Shell helper and content pixels
        run: npm run test:project-preview:shell:electron
      - run: npm run smoke:packaged:resources -- --profile=online
      - run: npm run smoke:installer:archive -- --profile=online
      - name: Verify packaged preview worker resources
        shell: pwsh
        run: |
          foreach ($name in @('projectPreviewImageWorker.js', 'projectPreviewProvidersWorker.js', 'projectPreviewPdfChild.js')) {
            $file = Join-Path 'release/win-unpacked/resources' $name
            if (!(Test-Path $file) -or (Get-Item $file).Length -eq 0) { throw "Missing worker: $name" }
          }
      - name: Verify isolated packaged startup
        run: node tests/packaged-launch-smoke.cjs
      - name: Collect full legacy UI diagnostics
        id: full_ui
        continue-on-error: true
        run: npm run smoke:ui:packaged:locales
      - name: Stage installer and verification evidence
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Get-ChildItem release -Filter '*.exe' -File | Where-Object { $_.Name -like '*Setup*' }
          if (@($installer).Count -ne 1) { throw 'Expected one installer' }
          $name = "Siftory-$version-Windows-x64-Setup.exe"
          Copy-Item $installer.FullName "artifacts/online-installer/$name"
          $hash = (Get-FileHash "artifacts/online-installer/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content artifacts/online-installer/SHA256SUMS.txt -Encoding ascii
          Copy-Item resources/runtime-manifest.json artifacts/online-installer/runtime-manifest.json
          Copy-Item THIRD_PARTY_COMPONENTS.md artifacts/online-installer/THIRD_PARTY_COMPONENTS.md
          Copy-Item BACKUP_SAFETY.md artifacts/online-installer/BACKUP_SAFETY.md
          Copy-Item docs/current/2026-11-14-alpha30-shell-isolation.md artifacts/online-installer/RELEASE_NOTES.md
          @{ startupPassed = $true; archivePassed = $true; fullUiOutcome = '${{ steps.full_ui.outcome }}'; upgradeVerified = $false } | ConvertTo-Json | Set-Content artifacts/online-installer/validation-status.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-online-installer
          path: artifacts/online-installer
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-package-checks
          path: |
            artifacts/installer-archive-smoke
            artifacts/ui-smoke*
            artifacts/online-installer/native-build.json
          if-no-files-found: warn
          retention-days: 14
