name: Publish verified Alpha 26
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-alpha26
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify pinned successful build
        shell: bash
        run: |
          gh api repos/$GH_REPO/actions/runs/43392959264 > run.json
          jq -e '.conclusion == "success" and .head_sha == "e10ae86c3c695a5c5eafc3338e8b0147faaed383" and .path == ".github/workflows/package-online.yml"' run.json
      - uses: actions/download-artifact@v4
        with:
          name: windows-online-installer
          path: installer
          run-id: 43392959264
          github-token: ${{ github.token }}
      - name: Verify and publish reviewed artifact
        working-directory: installer
        shell: bash
        run: |
          sha256sum --check SHA256SUMS.txt
          jq -e '.passed == true and .packaged == true and .nativeAddonLoaded == true and .projectPreviewWorkerPassed == true and .rendererReady == true and .version == "1.0.1-alpha.26"' startup-check.json
          jq -e '.startupPassed == true and .archivePassed == true' validation-status.json
          cat validation-status.json
          stat --format='%n %s bytes' *.exe
          gh release create v1.0.1-alpha.26 ./* --target e10ae86c3c695a5c5eafc3338e8b0147faaed383 --title 'Siftory 1.0.1-alpha.26 — Windows x64 Online' --prerelease --notes-file RELEASE_NOTES.md
