name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-index:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run build:native
      - run: node --test tests/native-incremental-index.test.cjs tests/native-search-correctness.test.cjs
      # Keep this hosted job focused on index storage/search. USN privileges and
      # thumbnail pressure workloads belong to their dedicated hardware checks.
      - run: node --test --test-name-pattern="manifest|mmap|index|resurrect|purge" tests/native-scan.test.cjs
  source-quality:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run ci:verify:source
      - run: npm run test:core-behavior
      - run: node --test tests/embedding-benchmark-protocol.test.cjs tests/vector-benchmark-snapshot.test.cjs tests/f16-dot-product.test.cjs tests/f16-snapshot-reader.test.cjs tests/vector-ann-index.test.cjs tests/vector-ann-worker.test.cjs
      - run: npm run benchmark:vector-rerank -- --rows=2048 --dim=128 --samples=5
      - run: npm run benchmark:vector-local -- --fixture --samples=3
      - run: npm run benchmark:vector-local -- --fixture-composite --samples=3
      - run: node --test --test-name-pattern="project updates honor|project search indexes|manifest cache identity|project preview proxy" tests/project-preview.test.cjs
      - run: npm run benchmark:core-search
      - run: npx playwright install chromium
      - run: npm run test:desktop:browser
