name: Build and publish Alpha 28
on:
  push:
    branches: [release/alpha28]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-alpha28
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/package-online.yml
    permissions:
      contents: read
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-online-installer
          path: installer
      - name: Verify and publish the matching installer
        working-directory: installer
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          jq -e '.passed == true and .packaged == true and .nativeAddonLoaded == true and .projectPreviewWorkerPassed == true and .projectPreviewPdfChildPassed == true and .rendererReady == true and .version == "1.0.1-alpha.28"' startup-check.json
          jq -e '.startupPassed == true and .archivePassed == true' validation-status.json
          jq -e --arg sha "$SOURCE_SHA" '.sourceCommit == $sha' native-build.json
          test -s Siftory-1.0.1-alpha.28-Windows-x64-Setup.exe
          gh release create v1.0.1-alpha.28 ./* --target "$SOURCE_SHA" --title 'Siftory 1.0.1-alpha.28 — Windows x64 Online' --prerelease --notes-file RELEASE_NOTES.md
