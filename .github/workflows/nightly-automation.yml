name: Nightly runtime health and performance

on:
  schedule:
    # 20:30 Asia/Shanghai. GitHub schedules use UTC.
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Automation depth
        required: true
        type: choice
        default: quick
        options:
          - quick
          - full

permissions:
  contents: read

concurrency:
  group: nightly-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-health:
    runs-on: [self-hosted, Windows, X64, floating-clock-models]
    timeout-minutes: 350
    env:
      SIFTORY_AUTOMATION_DATASET: ${{ vars.SIFTORY_AUTOMATION_DATASET }}
      SIFTORY_AUTOMATION_SOURCE: ${{ vars.SIFTORY_AUTOMATION_SOURCE }}
      SIFTORY_AUTOMATION_BASELINE: ${{ vars.SIFTORY_AUTOMATION_BASELINE }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run bounded nightly automation
        shell: powershell
        run: |
          $dataset = $env:SIFTORY_AUTOMATION_DATASET
          if (-not $dataset) { $dataset = 'D:\PxHereDataset\images\pxhere-000000' }
          $source = $env:SIFTORY_AUTOMATION_SOURCE
          if (-not $source) { $source = $dataset }
          $baseline = $env:SIFTORY_AUTOMATION_BASELINE
          $mode = '${{ inputs.mode }}'
          if (-not $mode) { $mode = 'full' }
          $nightlyArguments = @("--$mode", "--dataset=$dataset", "--source=$source", '--json')
          if ($mode -eq 'full') {
            $nightlyArguments += '--allow-network'
            $nightlyArguments += '--allow-generated-clean'
          }
          if ($baseline) { $nightlyArguments += "--baseline=$baseline" }
          npm.cmd run automation:nightly -- $nightlyArguments
      - name: Upload redacted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-runtime-${{ github.run_id }}
          path: artifacts/automation/nightly
          if-no-files-found: error
          retention-days: 14
