name: Publish verified Alpha 23
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-alpha23
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify pinned successful build
        shell: bash
        run: |
          gh api repos/$GH_REPO/actions/runs/41983902383 > run.json
          jq -e '.conclusion == "success" and .head_sha == "3ceca97aa69306e484a38d0d93cc1d995facb4f2" and .path == ".github/workflows/package-online.yml"' run.json
      - uses: actions/download-artifact@v4
        with:
          name: windows-online-installer
          path: installer
          run-id: 41983902383
          github-token: ${{ github.token }}
      - name: Verify and publish reviewed artifact
        working-directory: installer
        shell: bash
        run: |
          sha256sum --check SHA256SUMS.txt
          jq -e '.passed == true and .packaged == true and .nativeAddonLoaded == true and .rendererReady == true and .version == "1.0.1-alpha.23"' startup-check.json
          jq -e '.startupPassed == true and .archivePassed == true' validation-status.json
          cat validation-status.json
          stat --format='%n %s bytes' *.exe
          gh release create v1.0.1-alpha.23 ./* --target 3ceca97aa69306e484a38d0d93cc1d995facb4f2 --title 'Siftory 1.0.1-alpha.23 — Windows x64 Online' --prerelease --notes-file RELEASE_NOTES.md
