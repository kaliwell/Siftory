name: Publish verified Alpha32 PSD composite preview installer
on:
  push:
    branches: [release/alpha32]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Windows online installer run
        required: true
        default: '43572931805'
      source_sha:
        description: Exact installer source commit
        required: true
        default: 1aae6fd808d35b569a7b697174f1720c48575de5
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-alpha32
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ inputs.build_run_id || '43572931805' }}
      SOURCE_SHA: ${{ inputs.source_sha || '1aae6fd808d35b569a7b697174f1720c48575de5' }}
    steps:
      - name: Verify the source build succeeded
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > build-run.json
          jq -e --arg sha "$SOURCE_SHA" '.head_sha == $sha and .status == "completed" and .conclusion == "success" and .path == ".github/workflows/package-online.yml"' build-run.json
      - uses: actions/download-artifact@v4
        with:
          name: windows-online-installer
          path: installer
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify and publish the matching diagnostic installer
        working-directory: installer
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          jq -e '.passed == true and .packaged == true and .nativeAddonLoaded == true and .projectPreviewWorkerPassed == true and .projectPreviewPdfChildPassed == true and .rendererReady == true and .performanceDiagnosticsPassed == true and .performanceExportPassed == true and .shellPreviewIsolationPassed == true and .scanErrorDiagnosticsPassed == true and .psdCompositePreviewPassed == true and .version == "1.0.1-alpha.32"' startup-check.json
          jq -e '.startupPassed == true and .archivePassed == true' validation-status.json
          jq -e --arg sha "$SOURCE_SHA" '.sourceCommit == $sha' native-build.json
          test -s Siftory-1.0.1-alpha.32-Windows-x64-Setup.exe
          gh release create v1.0.1-alpha.32 ./* --target "$SOURCE_SHA" --title 'Siftory 1.0.1-alpha.32 — 高位深 PSD 预览测试版 Windows x64' --prerelease --notes-file RELEASE_NOTES.md
